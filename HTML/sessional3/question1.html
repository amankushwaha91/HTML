<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Box Model & Bootstrap Layout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{
    margin:0;
}
.header, .footer{
    background:#343a40;
    color:white;
    padding:20px;
    text-align:center;
}
.sidebar{
    background:#f8f9fa;
    padding:20px;
    border:2px solid #dee2e6;
    box-sizing:border-box;
}
.main{
    background:#ffffff;
    padding:20px;
    border:2px solid #dee2e6;
    box-sizing:border-box;
}
.footer{
    margin-top:10px;
}
</style>
</head>
<body>

<div class="header">
    <h2>Header</h2>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-12 col-md-3 sidebar">
            Sidebar
        </div>
        <div class="col-12 col-md-9 main">
            Main Content
        </div>
    </div>
</div>

<div class="footer">
    <p>Footer</p>
</div>

</body>
</html>
