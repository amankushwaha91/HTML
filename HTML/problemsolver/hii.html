<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I Love You Wife Ji 💖</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(circle at top, #1a001a, #000);
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
        overflow: hidden;
        font-family: 'Segoe UI', sans-serif;
    }

    .scene {
        transform-style: preserve-3d;
        animation: float 6s ease-in-out infinite;
    }

    .text3d {
        font-size: 80px;
        font-weight: bold;
        color: #ff4d88;
        text-align: center;
        transform-style: preserve-3d;
        position: relative;
        text-shadow:
            0 0 10px rgba(255,77,136,0.8),
            0 0 20px rgba(255,77,136,0.6),
            0 0 40px rgba(255,77,136,0.4);
    }

    .text3d::before {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        color: #990033;
        transform: translateZ(-30px);
        filter: blur(2px);
    }

    .heart {
        color: red;
        animation: pulse 1.5s infinite;
    }

    @keyframes float {
        0% { transform: rotateX(10deg) rotateY(-15deg) translateY(0); }
        50% { transform: rotateX(-10deg) rotateY(15deg) translateY(-20px); }
        100% { transform: rotateX(10deg) rotateY(-15deg) translateY(0); }
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.3); }
        100% { transform: scale(1); }
    }

    .hint {
        position: absolute;
        bottom: 20px;
        color: #fff;
        font-size: 14px;
        opacity: 0.6;
    }
</style>
</head>
<body>

<div class="scene" id="scene">
    <div class="text3d" data-text="I Love You Wife Ji">
        I <span class="heart">❤</span> Love You <br> Wife Ji
    </div>
</div>

<div class="hint">Move your mouse 💕</div>

<script>
    const scene = document.getElementById("scene");

    document.addEventListener("mousemove", (e) => {
        const x = (window.innerWidth / 2 - e.clientX) / 25;
        const y = (window.innerHeight / 2 - e.clientY) / 25;

        scene.style.transform =
            `rotateY(${x}deg) rotateX(${y}deg)`;
    });
</script>

</body>
</html>
