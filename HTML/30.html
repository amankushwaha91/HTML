<!DOCTYPE html>
<html>
<head>
<title>Student Registration</title>
<style>
body {
    font-family: Arial;
    background: #f2f2f2;
}
.form-box {
    width: 350px;
    margin: 60px auto;
    padding: 20px;
    background: white;
    border-radius: 5px;
}
input {
    width: 100%;
    padding: 8px;
    margin-top: 10px;
}
button {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    background: #4CAF50;
    color: white;
    border: none;
}
.error {
    color: red;
    font-size: 14px;
}
</style>
</head>

<body>
<div class="form-box">
<h2>Student Registration</h2>

<input type="text" id="name" placeholder="Enter Name">
<div id="nameErr" class="error"></div>

<input type="email" id="email" placeholder="Enter Email">
<div id="emailErr" class="error"></div>

<input type="text" id="phone" placeholder="Enter Phone Number">
<div id="phoneErr" class="error"></div>

<input type="password" id="password" placeholder="Enter Password">
<div id="passErr" class="error"></div>

<button onclick="validate()">Register</button>
</div>

<script>
function validate() {
    var name = document.getElementById("name").value;
    var email = document.getElementById("email").value;
    var phone = document.getElementById("phone").value;
    var password = document.getElementById("password").value;

    document.getElementById("nameErr").innerHTML = "";
    document.getElementById("emailErr").innerHTML = "";
    document.getElementById("phoneErr").innerHTML = "";
    document.getElementById("passErr").innerHTML = "";

    var valid = true;

    if (name.length < 3) {
        document.getElementById("nameErr").innerHTML = "Name must be at least 3 characters";
        valid = false;
    }

    if (!email.includes("@")) {
        document.getElementById("emailErr").innerHTML = "Invalid email format";
        valid = false;
    }

    if (phone.length != 10) {
        document.getElementById("phoneErr").innerHTML = "Phone number must be 10 digits";
        valid = false;
    }

    if (password.length < 6) {
        document.getElementById("passErr").innerHTML = "Password must be minimum 6 characters";
        valid = false;
    }

    if (valid) {
        alert("Registration Successful");
    }
}
</script>

</body>
</html>
